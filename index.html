<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一年级数学课堂互动练习</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap">
<style>
:root{
  --bg:#FFF9EE;
  --ink:#3A2D5C;
  --ink2:#7A6A9C;
  --card:#FFFFFF;
  --line:#EADFC9;
  --accent:#FF7A3D;
  --ok:#22A06B;
  --err:#E5484D;
  --blue:#2D6CDF;
  --shadow:0 6px 18px rgba(122,93,48,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1560px;margin:0 auto;padding:26px 36px 24px}

/* ===== 顶栏 ===== */
#topbar{display:flex;align-items:center;gap:28px}
.badge{
  width:118px;height:118px;border-radius:50%;color:#fff;flex:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:0 8px 18px rgba(0,0,0,.16);
}
.badge .n{font-size:52px;font-weight:900;line-height:1}
.badge .t{font-size:16px;font-weight:700;margin-top:4px;opacity:.95}
.badge-1{background:linear-gradient(145deg,#FF9A52,#F26B2E)}
.badge-2{background:linear-gradient(145deg,#5B9BFF,#2D6CDF)}
.badge-3{background:linear-gradient(145deg,#3FBF7E,#22A06B)}
.badge-4{background:linear-gradient(145deg,#B07FE6,#8E4FD0)}
.badge-5{background:linear-gradient(145deg,#F179C9,#E2479E)}
.badge-6{background:linear-gradient(145deg,#4AD5CB,#12A8A0)}
.badge-7{background:linear-gradient(145deg,#F2C14E,#D99A1B)}
.badge-8{background:linear-gradient(145deg,#FF7EB6,#E84A8A)}
.titles h1{font-size:54px;font-weight:900;letter-spacing:1px}
.titles p{font-size:30px;font-weight:700;color:var(--ink2);margin-top:6px}

/* ===== 舞台 ===== */
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 0}
.stage-card{
  background:var(--card);border-radius:36px;box-shadow:var(--shadow);
  padding:34px 44px;width:100%;max-width:1460px;
}
.hl{color:var(--accent);font-size:1.15em}

/* ===== 通用小元素 ===== */
.chip{
  width:100px;height:100px;border-radius:24px;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:center;flex:none;
}
.chip img{width:90px;height:90px;object-fit:contain}
.sec-btn{
  font-size:30px;font-weight:900;padding:14px 40px;border-radius:999px;border:none;
  background:var(--blue);color:#fff;cursor:pointer;font-family:inherit;
  box-shadow:0 5px 0 #1B4FA8,0 10px 18px rgba(45,108,223,.28);
}
.sec-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #1B4FA8}
.sec-btn.ghost{background:#fff;border:3px solid var(--line);color:var(--ink2);box-shadow:none}
.sec-btn.ghost:active{transform:translateY(2px)}
.sec-btn:focus-visible,.next-btn:focus-visible{outline:4px solid var(--blue);outline-offset:4px}

/* ===== 题型1：连线（一行排列） ===== */
.q1{position:relative}
.q1-top{margin-bottom:100px;text-align:center}
.q1-bottom{margin-top:100px;text-align:center}
.animal-group{
  display:inline-flex;flex-wrap:nowrap;gap:12px;justify-content:center;
  background:#FFF3E4;border:4px dashed transparent;border-radius:30px;padding:16px 22px;
  cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s;
}
.animal-group.selected{border-color:var(--accent);background:#FFE9D6}
.animal-group.ok{border-color:var(--ok);background:#E5F8EE}
.q1-cards{display:flex;flex-wrap:nowrap;gap:12px;justify-content:center}
.num-card{
  width:120px;height:134px;border-radius:22px;border:4px solid var(--blue);background:#fff;
  font-size:70px;font-weight:900;color:var(--blue);cursor:pointer;font-family:inherit;flex:none;
  transition:transform .1s,background .15s;
}
.num-card:hover{transform:scale(1.06)}
.num-card.selected{background:#E8F0FF;transform:scale(1.06)}
.num-card.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.num-card.dim{opacity:.32;pointer-events:none}
.q1 svg.lines{pointer-events:none;z-index:5}

/* ===== 题型2：圈一圈 / 题型6：数一数 ===== */
.q2-task{text-align:center;font-size:42px;font-weight:900;margin:6px 0 46px}
.q2-grid{position:relative;display:flex;flex-wrap:wrap;gap:22px;justify-content:center}
.animal-pick{
  position:relative;width:142px;height:142px;border-radius:50%;border:none;
  background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.1);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .1s;padding:0;
}
.animal-pick:hover{transform:scale(1.05)}
.animal-pick img{width:124px;height:124px;object-fit:contain;pointer-events:none}
.animal-pick.picked{box-shadow:0 0 0 10px var(--accent)}
.animal-pick .idx{
  position:absolute;top:-10px;right:-10px;width:54px;height:54px;border-radius:50%;
  background:var(--ok);color:#fff;font-size:30px;font-weight:900;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 6px rgba(0,0,0,.25);
}
.q2-grid svg.circle-overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
@keyframes ringGrow{from{transform:scale(.55);opacity:.2}to{transform:scale(1);opacity:1}}
.q2-grid svg.circle-overlay ellipse{transform-box:fill-box;transform-origin:center;animation:ringGrow .5s ease}
.q2-info{text-align:center;font-size:32px;font-weight:700;color:var(--ink2);margin-top:22px}
.q2-actions{display:flex;gap:16px;justify-content:center;margin-top:48px;flex-wrap:wrap}

/* ===== 题型3：比大小 ===== */
.q3-rows{display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.q3-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-start;align-items:center}
.q3-label{font-size:36px;font-weight:900;color:#7A6A4F;margin-right:14px;flex:none}
.q3-line{display:flex;gap:36px;justify-content:center;align-items:center;margin-top:34px;flex-wrap:wrap}
.q3-cmp{display:flex;align-items:center;gap:10px;background:#FBF7EE;border-radius:26px;padding:16px 26px}
.q3-mini{display:inline-flex}
.q3-mini img{width:64px;height:64px;object-fit:contain}
.q3-word{font-size:38px;font-weight:900;color:#7A6A4F}
.q3-pick{display:inline-flex;gap:10px;margin-left:6px}
.q3-opt{font-size:32px;font-weight:900;padding:8px 28px;border-radius:999px;border:4px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s,color .15s}
.q3-opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.q3-opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.q3-opt.bad{background:#FFE3E3;border-color:#E5484D;color:#E5484D}
.q3-row img{width:84px;height:84px;object-fit:contain;display:block}
.q3-qa{text-align:center;margin-top:44px}
.q3-btns{display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.ans-btn{
  font-size:34px;font-weight:900;padding:20px 46px;border-radius:999px;
  border:4px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;font-family:inherit;
  transition:border-color .15s,color .15s,transform .1s;
}
.ans-btn:hover{border-color:var(--accent);color:var(--accent);transform:scale(1.04)}
.ans-btn.correct{background:var(--ok);border-color:var(--ok);color:#fff}
.ans-btn.dim{opacity:.38;pointer-events:none}
.ans-img{display:inline-flex;vertical-align:middle;margin-right:8px}
.ans-img img{width:56px;height:56px;object-fit:contain}

/* ===== 题型4：找最多最少 ===== */
.q4-task{text-align:center;font-size:42px;font-weight:900;margin-bottom:28px}
.q4-task b{color:var(--accent)}
.q4-groups{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.q4-group{
  width:auto;flex:1 1 240px;max-width:340px;min-height:300px;background:#FBF4E4;border:6px solid transparent;border-radius:30px;
  padding:20px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;
  font-family:inherit;transition:border-color .15s,background .15s,transform .1s;
}
.q4-group:hover{border-color:var(--blue);transform:scale(1.03)}
.q4-group .gn{font-size:34px;font-weight:900;color:var(--ink)}
.q4-group .gi{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.q4-group .gi img{width:78px;height:78px;object-fit:contain}
.q4-group.ok{border-color:var(--ok);background:#E5F8EE}
.q4-group.dim{opacity:.4;pointer-events:none}

/* ===== 题型6：数一数（选数字） ===== */
.q6-inline{display:inline-flex;vertical-align:middle;margin:0 6px}
.q6-inline img{width:72px;height:72px;object-fit:contain}
.feedback .q6-inline img{width:52px;height:52px}
.q6-options{margin:24px auto 0;text-align:center}
.q6-question{font-size:34px;font-weight:900;color:var(--accent);margin-bottom:16px}
.q6-nums{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.q6-num{width:104px;height:118px;border-radius:22px;border:4px solid var(--blue);background:#fff;font-size:62px;font-weight:900;color:var(--blue);cursor:pointer;font-family:inherit;flex:none}
.q6-num.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.q6-num.dim{opacity:.3;pointer-events:none}

/* ===== 题型7：找第几 ===== */
.q7-task{display:flex;align-items:center;justify-content:center;gap:12px;text-align:center;font-size:38px;font-weight:900;margin:6px 0 30px;flex-wrap:wrap}
.q7-target img{width:84px;height:84px;object-fit:contain}
.q7-task b{color:var(--accent)}
.q7-row{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:34px}
.q7-animal{width:96px;height:96px;border-radius:24px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;flex:none}
.q7-animal img{width:86px;height:86px;object-fit:contain}
.q7-animal.hl{box-shadow:0 0 0 6px var(--ok)}
.q7-answers{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.q7-num{width:104px;height:118px;border-radius:22px;border:4px solid var(--blue);background:#fff;font-size:62px;font-weight:900;color:var(--blue);cursor:pointer;font-family:inherit;flex:none}
.q7-num.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.q7-num.dim{opacity:.3;pointer-events:none}
.q7-choice{width:132px;height:132px;border-radius:26px;border:4px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.q7-choice img{width:112px;height:112px;object-fit:contain;pointer-events:none}
.q7-choice.ok{border-color:var(--ok);background:#E5F8EE}
.q7-choice.dim{opacity:.3;pointer-events:none}

/* ===== 题型8：画一画 ===== */
.q8-task{text-align:center;font-size:40px;font-weight:900;margin:6px 0 30px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.q8-inline-shape{display:inline-flex;vertical-align:middle;margin:0 4px}
.q8-inline-shape .shape-svg{width:56px;height:56px}
.q8-inline-item{display:inline-flex;vertical-align:middle;margin:0 6px}
.q8-inline-item img{width:64px;height:64px;object-fit:contain}
.q8-wrap{display:flex;align-items:center;gap:44px;justify-content:center}
.q8-shape-btn{width:132px;height:132px;border-radius:30px;border:5px dashed var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;transition:border-color .15s,transform .1s}
.q8-shape-btn:hover{border-color:var(--accent);transform:scale(1.05)}
.q8-shape-btn .shape-svg{width:76px;height:76px}
.q8-grid{display:grid;gap:22px;row-gap:26px}
.q8-cell{min-width:70px;height:96px;display:flex;align-items:center;justify-content:center}
.q8-cell img{width:96px;height:96px;object-fit:contain}
.q8-draw .shape-svg{width:56px;height:56px}
.q8-actions{display:flex;justify-content:center;margin-top:30px}
/* 通用图形：空心黑边 */
.shape-svg{display:inline-block;width:48px;height:48px;flex:none}

/* ===== 题型5：找规律 ===== */
.q5{display:flex;flex-direction:column;align-items:center;gap:28px}
.q5-tip{font-size:32px;font-weight:700;color:var(--ink2);text-align:center}
.caterpillar{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;justify-content:center}
.cat-head{width:152px;height:152px;object-fit:contain;flex:none}
.seg{
  width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:60px;font-weight:900;font-family:inherit;color:#fff;
  background:linear-gradient(145deg,#5FBF5F,#3FA24B);
  box-shadow:0 5px 12px rgba(63,162,75,.35);border:none;cursor:default;flex:none;
}
.seg.blank{
  background:#fff;color:#B9A9D0;border:4px dashed #B9A9D0;cursor:pointer;box-shadow:none;
  transition:border-color .15s,background .15s;
}
.seg.blank:hover{background:#F3ECFF;border-color:#8E4FD0}
.seg.blank.active{background:#F3ECFF;border-color:var(--ok);border-style:solid}
.seg.filled-ok{background:linear-gradient(145deg,#FFC93F,#FF9F2E);box-shadow:0 5px 12px rgba(255,159,46,.4)}
.digit-picker{
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
  background:#F3ECFF;border-radius:28px;padding:16px 18px;
}
.digit-picker button{
  width:84px;height:90px;border-radius:18px;border:3px solid var(--blue);background:#fff;
  font-size:46px;font-weight:900;color:var(--blue);cursor:pointer;font-family:inherit;
}
.digit-picker button:hover{background:#E8F0FF}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.shake{animation:shake .25s}

/* ===== 底栏 ===== */
.footer{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:6px}
.feedback{min-height:60px;font-size:38px;font-weight:900;text-align:center;line-height:1.4}
.feedback.ok{color:var(--ok)}
.feedback.err{color:var(--err)}
.next-btn{
  width:min(380px,80%);height:92px;border-radius:46px;border:none;
  background:var(--accent);color:#fff;font-size:46px;font-weight:900;font-family:inherit;cursor:pointer;
  box-shadow:0 8px 0 #C94F1D,0 14px 22px rgba(255,122,61,.32);
  transition:transform .08s,box-shadow .08s;
}
.next-btn:hover{filter:brightness(1.04)}
.next-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #C94F1D,0 8px 14px rgba(255,122,61,.3)}

/* 完成动画 */
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease}

/* ===== 响应式 ===== */
@media (max-width: 960px){
  #app{padding:18px 18px 22px}
  .titles h1{font-size:40px}
  .titles p{font-size:26px}
  .badge{width:94px;height:94px}
  .badge .n{font-size:40px}
  .stage-card{padding:26px 18px}
  .num-card{width:88px;height:102px;font-size:52px}
  .chip{width:72px;height:72px}
  .chip img{width:64px;height:64px}
  .animal-pick{width:104px;height:104px}
  .animal-pick img{width:92px;height:92px}
  .q1-top{margin-bottom:64px}
  .q1-bottom{margin-top:64px}
  .q3-row img{width:64px;height:64px}
  .gl{font-size:28px}
  .q3-label{font-size:30px}
  .q3-cmp{gap:8px;padding:12px 16px}
  .q3-mini img{width:50px;height:50px}
  .q3-word{font-size:30px}
  .q3-opt{font-size:28px;padding:6px 20px}
  .q3-line{gap:22px}
  .cell img,.cell .hole{width:64px;height:64px}
  .seg{width:84px;height:84px;font-size:46px}
  .cat-head{width:118px;height:118px}
  .digit-picker button{width:64px;height:70px;font-size:36px}
  .feedback{font-size:30px}
  .next-btn{height:78px;font-size:36px}
  .q2-task,.q4-task{font-size:32px}
  .q5-tip{font-size:26px}
  .q4-group{flex:1 1 180px;max-width:260px}
  .q4-group .gi img{width:60px;height:60px}
  .ans-btn{font-size:28px;padding:16px 34px}
  .sec-btn{font-size:26px}
  .q2-info{font-size:26px}
  .animal-pick .idx{width:44px;height:44px;font-size:26px}
  .q6-inline img{width:56px;height:56px}
  .feedback .q6-inline img{width:44px;height:44px}
  .q6-question{font-size:28px}
  .q6-num{width:76px;height:90px;font-size:46px}
  .q7-task{font-size:30px}
  .q7-animal{width:76px;height:76px}
  .q7-animal img{width:68px;height:68px}
  .q7-target img{width:70px;height:70px}
  .q7-num{width:76px;height:90px;font-size:46px}
  .q7-choice{width:104px;height:104px}
  .q7-choice img{width:90px;height:90px}
  .q8-task{font-size:32px}
  .q8-wrap{gap:26px}
  .q8-inline-item img{width:52px;height:52px}
  .q8-shape-btn{width:100px;height:100px}
  .q8-shape-btn .shape-svg{width:56px;height:56px}
  .q8-cell{min-width:56px;height:80px}
  .q8-cell img{width:78px;height:78px}
  .q8-draw .shape-svg{width:46px;height:46px}
}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="badge" class="badge badge-1"><span id="badgeNum" class="n">1</span></div>
    <div class="titles">
      <h1 id="title">小动物找朋友</h1>
      <p id="hint"></p>
    </div>
  </header>

  <main id="stage" class="stage"></main>

  <footer class="footer">
    <div id="feedback" class="feedback" role="status"></div>
    <button id="nextBtn" class="next-btn">下一题</button>
  </footer>
</div>

  function rand(n, m){ return Math.floor(Math.random() * (m - n + 1)) + n; }
  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pickItems(n){
    var pool = ITEMS.slice(), out = [];
    while (out.length < n && pool.length){
      var i = Math.floor(Math.random() * pool.length);
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }
  function pickDistinct(lo, hi, n){
    var pool = [], out = [];
    for (var i = lo; i <= hi; i++) pool.push(i);
    while (out.length < n){
      var idx = Math.floor(Math.random() * pool.length);
      out.push(pool.splice(idx, 1)[0]);
    }
    return out;
  }
  /* 从 0..len-1 中随机挑 n 个互不相邻的位置 */
  function pickBlanks(len, n){
    var avail = [], taken = [];
    for (var i = 0; i < len; i++) avail.push(i);
    while (taken.length < n && avail.length){
      var idx = Math.floor(Math.random() * avail.length);
      var b = avail.splice(idx, 1)[0];
      taken.push(b);
      avail = avail.filter(function(x){ return Math.abs(x - b) > 1; });
    }
    return taken.sort(function(a,b){ return a - b; });
  }

  var actx = null;
  function ensureCtx(){

    }

  }
  function tone(freq, delay, dur){
    if (!actx) return;
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, actx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.22, actx.currentTime + delay + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + delay + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime + delay);
    o.stop(actx.currentTime + delay + dur + 0.05);
  }

  function genQ1(){

    return {
      animal: pick(ANIMALS),

  function genQ2(){
    var total = rand(6, 8);

    return { animal: pick(ANIMALS), total: total, target: target, picked: [] };
  }
  function genQ3(){
    var pair = pickItems(2);
    var ca = rand(1, 10), cb = rand(1, 10);
    while (ca === cb){ cb = rand(1, 10); }
    return { a: pair[0], b: pair[1], countA: ca, countB: cb, sel1: null, sel2: null };
  }
  function genQ4(){
    var n = rand(3, 4);
    var items = pickItems(n);
    var minC = rand(1, 6);
    var pool = [];
    for (var k = minC; k <= minC + 4; k++) pool.push(k);
    var counts = shuffle(pool).slice(0, n);
    var groups = [];
    for (var i = 0; i < n; i++){
      groups.push({ name: items[i].name, img: items[i].img, count: counts[i] });
    }
    return {
      groups: groups,
      maxIdx: counts.indexOf(Math.max.apply(null, counts)),
      minIdx: counts.indexOf(Math.min.apply(null, counts)),
      phase: "max"
    };
  }
  function genQ5(){
    var len = rand(5, 10);
    var asc = Math.random() < 0.5;
    var start = asc ? rand(1, 10 - len + 1) : rand(len, 10);
    var seq = [];
    for (var i = 0; i < len; i++) seq.push(asc ? start + i : start - i);
    var blankCount;
    if (len === 5) blankCount = 2;
    else if (len < 8) blankCount = 3;   /* 6、7 节：3 个空白 */
    else blankCount = 4;                /* 8、9、10 节：4 个空白 */
    var blanks = pickBlanks(len, blankCount);
    return { len: len, seq: seq, blanks: blanks, asc: asc, filled: [], activeBlank: null };
  }
  function genQ6(){
    var total = rand(1, 10);
    var opts = [total], pool = [];
    for (var k = 1; k <= 10; k++) if (k !== total) pool.push(k);
    while (opts.length < 4){
      var i = Math.floor(Math.random() * pool.length);
      opts.push(pool.splice(i, 1)[0]);
    }
    opts = shuffle(opts);
    return { animal: pick(ANIMALS), total: total, counted: 0, phase: "count", options: opts };
  }
  /* 找第几：一排 6-8 只不同小动物，问"谁排第几"或"排第几的是谁" */
  function genQ7(){
    var n = rand(6, 8);
    var pool = ANIMALS.slice(), row = [];
    while (row.length < n){
      var i = Math.floor(Math.random() * pool.length);
      row.push(pool.splice(i, 1)[0]);
    }
    var dir = Math.random() < 0.5 ? "L" : "R";
    var kind = Math.random() < 0.5 ? "who" : "which";
    var idx = rand(0, n - 1);
    var pos = dir === "L" ? idx + 1 : n - idx;
    var others = row.filter(function(_, j){ return j !== idx; });
    var distract = [], opool = others.slice();
    while (distract.length < 3 && opool.length){
      var j = Math.floor(Math.random() * opool.length);
      distract.push(opool.splice(j, 1)[0]);
    }
    var choices = shuffle([row[idx]].concat(distract));
    return { row: row, dir: dir, kind: kind, idx: idx, pos: pos, choices: choices };
  }

  /* ===== 题型1 交互（每条线独立小画布，不覆盖按钮，确保数字卡片可点） ===== */
  function q1Draw(n, ok, fromClass){
    var box = stage.querySelector(".q1");
    var a = stage.querySelector(fromClass || ".animal-group");
    var b = stage.querySelector('.num-card[data-num="' + n + '"]');
    if (!box || !a || !b) return;
    var br = box.getBoundingClientRect();
    var r1 = a.getBoundingClientRect(), r2 = b.getBoundingClientRect();
    var x1 = r1.left + r1.width / 2 - br.left;
    var y1 = r1.top + r1.height / 2 - br.top;
    var x2 = r2.left + r2.width / 2 - br.left;
    var y2 = r2.top + r2.height / 2 - br.top;
    var pad = 12;
    var minX = Math.min(x1, x2) - pad, minY = Math.min(y1, y2) - pad;
    var w = Math.abs(x1 - x2) + pad * 2, h = Math.abs(y1 - y2) + pad * 2;
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "lines");
    svg.setAttribute("width", w.toFixed(1));
    svg.setAttribute("height", h.toFixed(1));
    svg.setAttribute("pointer-events", "none");
    svg.style.position = "absolute";
    svg.style.left = minX.toFixed(1) + "px";
    svg.style.top = minY.toFixed(1) + "px";
    svg.style.pointerEvents = "none";
    var ln = document.createElementNS(ns, "line");
    ln.setAttribute("x1", (x1 - minX).toFixed(1));
    ln.setAttribute("y1", (y1 - minY).toFixed(1));
    ln.setAttribute("x2", (x2 - minX).toFixed(1));
    ln.setAttribute("y2", (y2 - minY).toFixed(1));
    ln.setAttribute("stroke", ok ? "#22A06B" : "#E5484D");
    ln.setAttribute("stroke-width", ok ? 10 : 8);
    ln.setAttribute("stroke-linecap", "round");
    svg.appendChild(ln);
    box.appendChild(svg);
    if (!ok) setTimeout(function(){ svg.remove(); }, 1000);
  }

  }

  /* ===== 题型2：检查正确后用一个大圈圈住选中的小动物 ===== */
  function q2DrawBigCircle(picks){
    var grid = stage.querySelector(".q2-grid");
    if (!grid || !picks || !picks.length) return;
    var gr = grid.getBoundingClientRect();
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    picks.forEach(function(p){
      var r = p.getBoundingClientRect();
      if (r.left < minX) minX = r.left;
      if (r.top < minY) minY = r.top;
      if (r.right > maxX) maxX = r.right;
      if (r.bottom > maxY) maxY = r.bottom;
    });
    var pad = 24;
    minX -= pad; minY -= pad; maxX += pad; maxY += pad;
    var cx = (minX + maxX) / 2 - gr.left;
    var cy = (minY + maxY) / 2 - gr.top;
    var rx = Math.max((maxX - minX) / 2, 44);
    var ry = Math.max((maxY - minY) / 2, 44);
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "circle-overlay");
    var ell = document.createElementNS(ns, "ellipse");
    ell.setAttribute("cx", cx.toFixed(1));
    ell.setAttribute("cy", cy.toFixed(1));
    ell.setAttribute("rx", rx.toFixed(1));
    ell.setAttribute("ry", ry.toFixed(1));
    ell.setAttribute("fill", "rgba(34,160,107,.12)");
    ell.setAttribute("stroke", "#22A06B");
    ell.setAttribute("stroke-width", "8");
    svg.appendChild(ell);
    grid.appendChild(svg);
  }

  /* ===== 题型5 交互 ===== */
  function q5Fill(seg, n){
    var d = quiz.data;
    seg.classList.remove("blank", "active");
    seg.classList.add("filled-ok");
    seg.textContent = n;
    seg.removeAttribute("data-action");
    seg.disabled = true;
    d.filled.push(d.activeBlank);
    d.activeBlank = null;
    document.getElementById("picker").hidden = true;
  }

  /* ===== 事件处理器 ===== */
  var H = {
    1: {
      group: function(){
        if (quiz.done) return;
        var d = quiz.data;
        if (d.phase !== 1){
          feedback("第一连已经对啦！再连下面的物品。", "");
          return;
        }
        var card = stage.querySelector(".num-card.selected");
        if (card){ q1Connect(+card.getAttribute("data-num")); return; }
        q1ClearSel();
        q1SelGroup = true;
        stage.querySelector(".animal-group").classList.add("selected");
      },
      igroup: function(){
        if (quiz.done) return;
        var d = quiz.data;
        if (d.phase !== 2){
          feedback("先把上面的小动物连到数字上。", "");
          return;
        }
        var card = stage.querySelector(".num-card.selected");
        if (card){ q1Connect2(+card.getAttribute("data-num")); return; }
        q1ClearSel();
        q1SelItem = true;
        stage.querySelector(".item-group").classList.add("selected");
      },
      num: function(el){
        if (quiz.done) return;
        var d = quiz.data;
        if (q1SelGroup && d.phase === 1){ q1Connect(+el.getAttribute("data-num")); return; }
        if (q1SelItem && d.phase === 2){ q1Connect2(+el.getAttribute("data-num")); return; }
        q1ClearSel();
        el.classList.add("selected");
        feedback(d.phase === 1 ? "再点一点上面的小动物，就连起来啦！" : "再点一点下面的物品，就连起来啦！", "");
      }
    },
    2: {
      pick: function(el){
        var d = quiz.data;
        if (d.done) return;
        var i = +el.getAttribute("data-i");
        if (el.classList.contains("picked")) return;
        if (i !== d.picked.length){
          feedback("要按顺序点哦，从第一只开始。", "err");
          sfxErr();
          return;
        }
        d.picked.push(i);
        el.classList.add("picked");
        sfxOk();
      },
      check: function(){
        var d = quiz.data;
        var picks = stage.querySelectorAll(".animal-pick.picked");
        var n = picks.length;
        if (n === d.target){
          quiz.done = true;
          q2DrawBigCircle(picks);
          picks.forEach(function(x){ x.classList.remove("picked", "green"); });
          feedback("太棒啦！正好圈出 " + d.target + " 只！", "ok");
          sfxOk();
        } else {
          picks.forEach(function(x){ x.classList.remove("picked", "green"); });
          d.picked = [];
          feedback("没有选对，请重新选择。", "err");
          sfxErr();
        }
      },
      reset: function(){ redraw(); }
    },
    3: {
      opt: function(el){
        var d = quiz.data;
        if (d.done) return;
        var seg = +el.getAttribute("data-seg");
        var v = el.getAttribute("data-v");
        if (seg === 1){ d.sel1 = v; } else { d.sel2 = v; }
        var box = stage.querySelector('.q3-pick[data-seg="' + seg + '"]');
        box.querySelectorAll(".q3-opt").forEach(function(b){
          b.classList.remove("bad");
          b.classList.toggle("on", b === el);
        });
        sfxOk();
      },
      check3: function(){
        var d = quiz.data;
        if (d.done) return;
        if (d.sel1 === null || d.sel2 === null){
          feedback("两个括号都要选一选哦！", "err");
          sfxErr();
          return;
        }
        var c1 = d.countA > d.countB ? "more" : "less";
        var c2 = d.countB > d.countA ? "more" : "less";
        if (d.sel1 === c1 && d.sel2 === c2){
          quiz.done = true;
          stage.querySelectorAll(".q3-opt.on").forEach(function(b){ b.classList.add("ok"); });
          feedback("太棒啦！比一比，都对啦！", "ok");
          sfxOk();
        } else {
          stage.querySelectorAll(".q3-opt").forEach(function(b){
            if (!b.classList.contains("on")) return;
            var seg = +b.getAttribute("data-seg");
            var v = b.getAttribute("data-v");
            var correct = seg === 1 ? c1 : c2;
            if (v !== correct) b.classList.add("bad");
          });
          feedback("再数一数，重新选一选。", "err");
          sfxErr();
        }
      },
      reset: function(){ redraw(); }
    },
    4: {
      pick: function(el){
        var d = quiz.data, i = +el.getAttribute("data-i");
        if (d.phase === "max"){
          if (i === d.maxIdx){
            el.classList.add("ok");
            d.phase = "min";
            document.getElementById("q4task").innerHTML = "问题 2：哪一组<b>最少</b>？点一点。";
            feedback("对啦！这一组最多。再找一找最少的那组。", "ok");
            sfxOk();
          } else {
            feedback("再数一数，哪一组最多？", "err");
            sfxErr();
          }
        } else {
          if (i === d.minIdx){
            quiz.done = true;
            el.classList.add("ok");
            stage.querySelectorAll(".q4-group").forEach(function(x){
              if (!x.classList.contains("ok")) x.classList.add("dim");
            });
            feedback("太棒啦！最多和最少的组都找到啦！", "ok");
            sfxOk();
          } else {
            feedback("再数一数，哪一组最少？", "err");
            sfxErr();
          }
        }
      }
    },
    5: {
      blank: function(el){
        var d = quiz.data, i = +el.getAttribute("data-i");
        if (d.activeBlank === i){
          d.activeBlank = null;
          el.classList.remove("active");
          document.getElementById("picker").hidden = true;
          return;
        }
        d.activeBlank = i;
        stage.querySelectorAll(".seg.blank").forEach(function(x){ x.classList.remove("active"); });
        el.classList.add("active");
        document.getElementById("picker").hidden = false;
      },
      digit: function(el){
        var d = quiz.data;
        if (d.activeBlank === null) return;
        var n = +el.getAttribute("data-n"), i = d.activeBlank;
        if (n === d.seq[i]){
          q5Fill(stage.querySelector('.seg[data-i="' + i + '"]'), n);
          if (d.filled.length === d.blanks.length){
            quiz.done = true;
            feedback("太棒啦！毛毛虫的数都填对啦！", "ok");
            sfxOk();
          } else {
            feedback("对啦！再看看还有哪里空着。", "ok");
            sfxOk();
          }
        } else {
          var picker = document.getElementById("picker");
          picker.classList.remove("shake");
          void picker.offsetWidth;
          picker.classList.add("shake");
          feedback("再想一想，按顺序应该是几？", "err");
          sfxErr();
        }
      }
    },
    6: {
      pick: function(el){
        var d = quiz.data;
        if (d.phase !== "count") return;
        if (el.classList.contains("picked")) return;
        d.counted++;
        el.classList.add("picked");
        sfxOk();
        if (d.counted === d.total){
          d.phase = "pick";
          var optBox = stage.querySelector(".q6-options");
          var html = '<div class="q6-question">一共有几只？</div><div class="q6-nums">';
          d.options.forEach(function(n){
            html += '<button class="q6-num" data-action="num" data-n="' + n + '">' + n + "</button>";
          });
          html += "</div>";
          optBox.innerHTML = html;
        }
      },
      num: function(el){
        var d = quiz.data;
        var n = +el.getAttribute("data-n");
        if (n === d.total){
          quiz.done = true;
          el.classList.add("ok");
          stage.querySelectorAll(".q6-num").forEach(function(x){
            if (!x.classList.contains("ok")) x.classList.add("dim");
          });
          feedback('对啦！这里一共有 ' + d.total + ' 只<span class="q6-inline"><img src="' + d.animal.img + '" alt=""></span>！', "ok");
          sfxOk();
        } else {
          feedback("再数一数，选一选正确的数字。", "err");
          sfxErr();
        }
      },
      reset: function(){ redraw(); }
    },
    7: {
      num: function(el){
        var d = quiz.data;
        var n = +el.getAttribute("data-n");
        if (n === d.pos){
          quiz.done = true;
          el.classList.add("ok");
          stage.querySelectorAll(".q7-num").forEach(function(x){
            if (!x.classList.contains("ok")) x.classList.add("dim");
          });
          stage.querySelector('.q7-animal[data-i="' + d.idx + '"]').classList.add("hl");
          var dirTxt = d.dir === "L" ? "从左往右数" : "从右往左数";
          feedback("对啦！" + dirTxt + "，它排第 " + d.pos + "！", "ok");
          sfxOk();
        } else {
          feedback("再数一数，看从哪边开始数。", "err");
          sfxErr();
        }
      },
      choice: function(el){
        var d = quiz.data;
        var i = +el.getAttribute("data-i");
        if (i === d.idx){
          quiz.done = true;
          el.classList.add("ok");
          stage.querySelectorAll(".q7-choice").forEach(function(x){
            if (!x.classList.contains("ok")) x.classList.add("dim");
          });
          stage.querySelector('.q7-animal[data-i="' + d.idx + '"]').classList.add("hl");
          var dirTxt = d.dir === "L" ? "从左往右数" : "从右往左数";
          feedback("对啦！" + dirTxt + "，排第 " + d.pos + " 的是它！", "ok");
          sfxOk();
        } else {
          feedback("再数一数，看从哪边开始数。", "err");
          sfxErr();
        }
      }
    },
    8: {
      draw: function(){
        var d = quiz.data;
        if (d.done) return;
        if (d.drawn >= 10){
          feedback("最多只能画 10 个哦！", "err");
          sfxErr();
          return;
        }
        var cell = stage.querySelector('.q8-draw[data-i="' + d.drawn + '"]');
        cell.innerHTML = shapeHtml(d.shape);
        d.drawn++;
        sfxOk();
      },
      check: function(){
        var d = quiz.data;
        if (d.done) return;
        var ok = (d.mode === "less" && d.drawn < d.count) ||
                 (d.mode === "same" && d.drawn === d.count) ||
                 (d.mode === "more" && d.drawn > d.count);
        if (ok){
          quiz.done = true;
          var itemImg = '<span class="q8-inline-item"><img src="' + d.item.img + '" alt=""></span>';
          var modeTxt = d.mode === "less" ? "比 " + itemImg + " 少" : (d.mode === "more" ? "比 " + itemImg + " 多" : "和 " + itemImg + " 一样多");
          feedback('太棒啦！画了 ' + d.drawn + ' 个<span class="q8-inline-shape">' + shapeHtml(d.shape) + "</span>，" + modeTxt + "！", "ok");
          sfxOk();
        } else {
          stage.querySelectorAll(".q8-draw").forEach(function(c){ c.innerHTML = ""; });
          d.drawn = 0;
          feedback("再数一数，重新画一画。", "err");
          sfxErr();
        }
      }
    }
  };

  stage.addEventListener("click", function(e){
    var g = e.target.closest("[data-action]");
    if (!g) return;
    var act = g.getAttribute("data-action");
    if (quiz.done && act !== "reset") return;
    var h = H[quiz.type];
    if (!h || typeof h[act] !== "function") return;
    h[act](g);
  });

  /* ===== 渲染入口 ===== */
  function redraw(){
    quiz.done = false;
    stage.innerHTML = VIEWS[quiz.type]();
    feedbackClear();
  }
  function render(){
    quiz.done = false;
    quiz.data = GEN[quiz.type]();
    var meta = TITLES[quiz.type];
    document.getElementById("badge").className = "badge badge-" + quiz.type;
    document.getElementById("badgeNum").textContent = quiz.no;
    document.getElementById("title").textContent = meta.title;
    stage.innerHTML = VIEWS[quiz.type]();
    feedbackClear();
  }

  document.getElementById("nextBtn").addEventListener("click", function(){
    quiz.no++;
    quiz.type = (quiz.type % 8) + 1;
    render();
  });

  /* ===== 启动 ===== */
  quiz.type = 1;
  render();
})();
</script>
